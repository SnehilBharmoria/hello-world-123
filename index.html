<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS - 3D Game Store</title>
  <!-- Three.js Library for 3D Graphics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #0078f2;
    }
    nav a {
      color: #ccc;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover { color: #0078f2; }
    .cart-btn {
      background: #0078f2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 3D Hero Section */
    .hero {
      position: relative;
      height: 70vh;
      margin-top: 80px;
      display: flex;
      align-items: center;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hero-text {
      position: relative;
      z-index: 2;
      margin-left: 50px;
      max-width: 500px;
      pointer-events: none;
    }
    .hero-text h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 15px;
    }
    .hero-text p {
      color: #aaa;
      margin-bottom: 25px;
    }
    .buy-btn {
      pointer-events: auto;
      background: #ffffff;
      color: #121212;
      border: none;
      padding: 15px 35px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .buy-btn:hover {
      background: #0078f2;
      color: white;
      transform: translateY(-2px);
    }

    /* Game Store Grid */
    .store-section {
      padding: 50px;
    }
    .section-title {
      font-size: 1.8rem;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
    }
    .card {
      background: #202020;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 120, 242, 0.3);
    }
    .card-img {
      height: 280px;
      background-size: cover;
      background-position: center;
    }
    .card-info {
      padding: 15px;
    }
    .card-title {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .price-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }
    .price {
      font-weight: bold;
      color: #0078f2;
    }
    .add-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-btn:hover { background: #555; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">NEXUS</div>
    <nav>
      <a href="#">Discover</a>
      <a href="#">Browse</a>
      <a href="#">News</a>
    </nav>
    <button class="cart-btn" onclick="alert('Cart opened!')">Cart (0)</button>
  </header>

  <!-- 3D Hero Section -->
  <section class="hero">
    <div id="canvas-container"></div>
    <div class="hero-text">
      <h1>CYBER ODYSSEY 2077</h1>
      <p>Experience the next generation of interactive 3D gaming directly in your browser.</p>
      <button class="buy-btn" onclick="addToCart('Cyber Odyssey 2077')">Pre-Order Now - $59.99</button>
    </div>
  </section>

  <!-- Store Section -->
  <section class="store-section">
    <h2 class="section-title">Featured Games</h2>
    <div class="grid">
      
      <div class="card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80');"></div>
        <div class="card-info">
          <div class="card-title">Neon Warfare</div>
          <p style="color: #777; font-size: 0.85rem;">Action / Sci-Fi</p>
          <div class="price-bar">
            <span class="price">$49.99</span>
            <button class="add-btn" onclick="addToCart('Neon Warfare')">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80');"></div>
        <div class="card-info">
          <div class="card-title">Astra Realm</div>
          <p style="color: #777; font-size: 0.85rem;">RPG / Fantasy</p>
          <div class="price-bar">
            <span class="price">$39.99</span>
            <button class="add-btn" onclick="addToCart('Astra Realm')">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80');"></div>
        <div class="card-info">
          <div class="card-title">Velocity Shift</div>
          <p style="color: #777; font-size: 0.85rem;">Racing / Sports</p>
          <div class="price-bar">
            <span class="price">$29.99</span>
            <button class="add-btn" onclick="addToCart('Velocity Shift')">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Three.js 3D Background Script -->
  <script>
    let cartCount = 0;
    function addToCart(gameName) {
      cartCount++;
      document.querySelector('.cart-btn').innerText = `Cart (${cartCount})`;
      alert(`${gameName} added to your cart!`);
    }

    // Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Create a 3D Cyber Cube
    const geometry = new THREE.IcosahedronGeometry(2, 1);
    const material = new THREE.MeshStandardMaterial({ 
      color: 0x0078f2, 
      wireframe: true 
    });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.x = 2; // Offset to the right side of the screen
    scene.add(cube);

    // Add Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x0078f2, 2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.005;
      cube.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
